<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for Android maskable cropping -->
  <rect x="0" y="0" width="512" height="512" fill="url(#maskGrad)" />

  <!-- Centered within the 80% safe zone (inner 410px) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Vault Body Plate -->
    <rect x="40" y="40" width="432" height="432" rx="60" fill="#312E81" fill-opacity="0.45" stroke="#818CF8" stroke-width="8" stroke-opacity="0.6" />

    <!-- Vault Door Dial Outer Ring -->
    <circle cx="256" cy="256" r="118" fill="url(#dialGrad)" />
    
    <!-- Dial Inner Ring -->
    <circle cx="256" cy="256" r="95" fill="#4F46E5" />
    
    <!-- Dial Center Pin -->
    <circle cx="256" cy="256" r="42" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="18" fill="#3730A3" />

    <!-- Dial Ticks -->
    <line x1="256" y1="168" x2="256" y2="182" stroke="#EEF2FF" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="330" x2="256" y2="344" stroke="#EEF2FF" stroke-width="8" stroke-linecap="round" />
    <line x1="168" y1="256" x2="182" y2="256" stroke="#EEF2FF" stroke-width="8" stroke-linecap="round" />
    <line x1="330" y1="256" x2="344" y2="256" stroke="#EEF2FF" stroke-width="8" stroke-linecap="round" />

    <!-- 4 Corner Bolted Rivets -->
    <circle cx="84" cy="84" r="16" fill="#A5B4FC" fill-opacity="0.8" />
    <circle cx="428" cy="84" r="16" fill="#A5B4FC" fill-opacity="0.8" />
    <circle cx="84" cy="428" r="16" fill="#A5B4FC" fill-opacity="0.8" />
    <circle cx="428" cy="428" r="16" fill="#A5B4FC" fill-opacity="0.8" />
  </g>
</svg>
